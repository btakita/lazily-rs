name: Regressions

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  loom:
    name: Loom model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Test loom model
        run: cargo +stable test --locked --features loom --test thread_safe_loom

  benchmark-budgets:
    name: Benchmark regression budgets
    # Pin the image generation. Pass/fail uses instrumentation counters with
    # spread-derived ceilings (#lzbenchbudgetheadroom); wall-clock Criterion
    # timings remain diagnostic evidence only.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Generate benchmark evidence
        run: cargo +stable bench --locked --features "instrumentation,async,tokio,thread-safe"

      # Record the instrumentation profile plus a content fingerprint of the
      # sources the step above measured (#vnmr). Without this the gate below sees
      # evidence with no provenance and refuses it — it cannot tell "measured this
      # tree" from "measured some tree". `--no-run` because the benches already
      # ran; this only adds the instrumentation profile and the manifest.
      - name: Record evidence provenance
        env:
          RUSTUP_TOOLCHAIN: stable
        run: make benchmark-evidence-record

      - name: Enforce spread-derived budgets
        env:
          RUSTUP_TOOLCHAIN: stable
        run: make benchmark-check
