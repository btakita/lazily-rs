name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust
    runs-on: ubuntu-latest

    # Runtime conformance evidence (#lzguardsnotinci).
    #
    # Four guards stand over the conformance corpus, and they do NOT all execute
    # the same way:
    #
    #   0. assertion-block BIND ledger   scripts/check-conformance-coverage.sh
    #   1. fixture manifest / coverage   scripts/check-conformance-coverage.sh
    #   2. unconsumed assertion key      tests/common/expect.rs, panics on drop
    #   3. unasserted assertion key      tests/common/expect.rs, panics on drop
    #   4. scenario replay ledger        scripts/check-conformance-coverage.sh
    #
    # Rung 0 sits BELOW rungs 2 and 3 (#lznullformblind): both of those are
    # scoped to blocks a runner already BOUND to the tracker, so a block NO
    # runner binds reports nothing at all -- its keys are not unread, nothing
    # reads them. Its ledger is a third runtime evidence file on exactly the
    # same terms as the two below.
    #
    # Rungs 2 and 3 live INSIDE the test binaries, so any `cargo test` step
    # enforces them for the runners it happens to compile. Rungs 1 and 4 are a
    # separate script step that only `make check` used to invoke, so CI — which
    # runs cargo directly — enforced neither. That is the silent half: a fixture
    # nobody replays and a scenario nobody replays both went green here while
    # going red locally.
    #
    # Both script rungs read a RUNTIME evidence file appended to by every test
    # binary, so the paths must be ABSOLUTE (test binaries run from varying
    # working directories) and exported to every step, exactly as the Makefile
    # does. Unset means the recorder is a no-op and the evidence file is never
    # written — and a guard whose evidence is absent must fail rather than pass
    # vacuously, which is why the script treats an absent or empty file as a
    # failure rather than as "nothing was read".
    env:
      LAZILY_CONFORMANCE_MANIFEST: ${{ github.workspace }}/build/conformance-fixtures-loaded.txt
      LAZILY_CONFORMANCE_SCENARIOS: ${{ github.workspace }}/build/conformance-scenarios-replayed.txt
      LAZILY_CONFORMANCE_BLOCKS: ${{ github.workspace }}/build/conformance-assertion-blocks.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lazily-spec owns both the canonical cross-language fixtures and the
      # generated Protobuf source. Fetch it before any all-feature compile so
      # the optional `protobuf` build cannot fall back to a copied schema.
      - name: Fetch canonical lazily-spec conformance fixtures (#lzspecconf)
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo +stable build --locked --all-targets --all-features

      # Truncate ONCE, before the first test step (#lzguardsnotinci). Every test
      # binary APPENDS its share, so the files have to be reset here and nowhere
      # else — this is `conformance-manifest-reset`, which `make check` runs
      # first for the same reason.
      - name: Reset the runtime conformance evidence (#lzguardsnotinci)
        run: |
          mkdir -p "$(dirname "$LAZILY_CONFORMANCE_MANIFEST")"
          : > "$LAZILY_CONFORMANCE_MANIFEST"
          mkdir -p "$(dirname "$LAZILY_CONFORMANCE_SCENARIOS")"
          : > "$LAZILY_CONFORMANCE_SCENARIOS"
          mkdir -p "$(dirname "$LAZILY_CONFORMANCE_BLOCKS")"
          : > "$LAZILY_CONFORMANCE_BLOCKS"

      - name: Test default features
        run: cargo +stable test --locked

      - name: Test thread-safe feature (#lzthreadsafe)
        run: cargo +stable test --locked --features thread-safe

      - name: Test Tokio feature
        run: cargo +stable test --locked --features "tokio thread-safe"

      - name: Test distributed feature
        run: cargo +stable test --locked --features "distributed serde"

      - name: Test distributed CRDT plane runtime integration (#lzcrdtplane5b)
        run: cargo +stable test --locked --features "distributed webrtc"

      # Named explicitly rather than left to the feature-set step above. That
      # step happens to compile this test target today; naming it is what makes
      # the distributed conformance corpus a gate CI owns instead of a side
      # effect of a feature list someone may narrow later.
      - name: Test distributed conformance corpus
        run: cargo +stable test --locked --features "distributed webrtc" --test distributed_conformance

      # The cross-binding wire-compatibility gate. `make check` has always run
      # it; no binding's CI ran it anywhere (#lzinteroppeerci). Nine bindings
      # have to agree on a byte layout, and the check proving they still do lived
      # exclusively on developer machines — the exact shape of rot the
      # conformance guards were moved into CI to stop.
      - name: Interop peer self-check (#lzinteroppeerci)
        run: cargo +stable run --locked --quiet --features "distributed webrtc" --bin lazily-interop-peer -- --self-check

      - name: Test signaling client feature
        run: cargo +stable test --locked --features signaling-client

      - name: Test async feature
        run: cargo +stable test --locked --features async

      - name: Test WebRTC DataChannel transport + str0m backend (#webrtcbackend)
        run: cargo +stable test --locked --features webrtc-str0m

      - name: Test WebSocket DataChannel backend (#akp3)
        run: cargo +stable test --locked --features websocket

      # Full WebRTC handshake driven THROUGH SignalingClient. Needs BOTH feature
      # trees, so neither the signaling-client step nor the webrtc-str0m step
      # above compiles this test binary.
      - name: Test WebRTC handshake over signaling
        run: |
          cargo +stable test --locked --features "signaling-client webrtc-str0m" --lib webrtc_signaling::
          cargo +stable test --locked --features "signaling-client webrtc-str0m" --test webrtc_signaling

      # FFI / IPC codec matrix (#lzguardsnotinci). Four invocations, not one: the
      # JSON and binary codecs are separate feature trees over the SAME test
      # binaries, and `make check` runs all four. CI ran none of them, so the IPC
      # binary codec had no gate here at all.
      - name: Test FFI surface (JSON codec)
        run: cargo +stable test --locked --features ffi --test ffi

      - name: Test FFI surface (binary codec)
        run: cargo +stable test --locked --features "ffi ipc-binary" --test ffi

      - name: Test IPC transport (JSON codec)
        run: cargo +stable test --locked --features ffi --test ipc

      - name: Test IPC transport (binary codec)
        run: cargo +stable test --locked --features ipc-binary --test ipc

      # #lzspecbase64: the json-base64 codec's tests are feature-gated and no other
      # step enables the feature, so before this they compiled under clippy and ran
      # nowhere. The --lib half carries the encoder's byte-array guards.
      - name: Test IPC transport (json-base64 codec)
        run: |
          cargo +stable test --locked --features json-base64 --lib ipc::
          cargo +stable test --locked --features json-base64 --test ipc

      # Cross-process zero-copy transport: POSIX shm_open + mmap, plus the
      # fork() cross-process smoke. Linux-only, which ubuntu-latest is.
      - name: Test zero-copy shm transport
        run: "cargo +stable test --locked --features ipc,shm --lib transport::"

      - name: Test async resolve-loop windows (#k03k)
        run: cargo +stable test --locked --features "async instrumentation" --test async_resolve_loop

      - name: Test demand-driven reader-kinds + store-without-cascade (Phase 0 #relaycell)
        run: cargo +stable test --locked --features instrumentation --test queue_demand_driven

      - name: Test IPC conformance against canonical spec fixtures (#lzspecconf)
        run: |
          test -d ../lazily-spec/conformance || { echo "::error::../lazily-spec/conformance missing — conformance.rs would silently fall back to local fixtures"; exit 1; }
          cargo +stable test --locked --features ipc --test conformance

      - name: Test JSON Schema compliance against canonical spec schemas (#lzspecschema)
        run: |
          test -d ../lazily-spec/schemas || { echo "::error::../lazily-spec/schemas missing"; exit 1; }
          cargo +stable test --locked --features ipc --test schema_compliance

      - name: Test keyed cell collections conformance against canonical spec fixtures (#lzcellfamily)
        run: |
          test -d ../lazily-spec/conformance/collections || { echo "::error::../lazily-spec/conformance/collections missing — collections_conformance.rs would silently fall back to local fixtures"; exit 1; }
          cargo +stable test --locked --test collections_conformance

      - name: Test reactive-graph disposal/teardown conformance against canonical spec fixtures (#lzspecedgeindex)
        run: |
          test -d ../lazily-spec/conformance/reactive-graph || { echo "::error::../lazily-spec/conformance/reactive-graph missing — reactive_graph_conformance.rs would silently skip the whole disposal/teardown corpus"; exit 1; }
          # The corpus is parameterised over the execution model, and the
          # ThreadSafeContext / AsyncContext models are feature-gated. Running
          # only the default-feature test would silently drop two thirds of the
          # coverage, which is the exact failure mode this corpus exists to kill.
          cargo +stable test --locked --test reactive_graph_conformance
          cargo +stable test --locked --features thread-safe --test reactive_graph_conformance
          cargo +stable test --locked --features async --test reactive_graph_conformance
          # Assert all three models actually ran, rather than trusting a green tick.
          cargo +stable test --locked --features "thread-safe async" --test reactive_graph_conformance -- --nocapture 2>&1 | tee /tmp/rg.log
          # Derive the expected count from the corpus rather than hardcoding it.
          # A literal went stale the moment lazily-spec grew a fixture, and the
          # failure reads as "the corpus did not replay" — which points at the
          # runner rather than at this guard. Deriving keeps the assertion exact
          # (not a >=N floor, which would let a silently-skipped fixture pass)
          # while surviving upstream additions.
          #
          # Every fixture must be ACCOUNTED FOR, which is not the same as replayed:
          # a model may declare a runner limitation in the MODEL_SKIPS ledger, and
          # the runner prints one `SKIP reactive-graph[<model>] <fixture>` line per
          # entry. Those are named and asserted in both directions by the test, so
          # they are the opposite of the silent skip this guard exists to catch —
          # but they are not replays, so they are counted separately. What must
          # hold exactly is replayed + declared-skips == corpus.
          expected=$(ls ../lazily-spec/conformance/reactive-graph/*.json | wc -l)
          test "$expected" -gt 0 || { echo "::error::no reactive-graph fixtures found — the corpus is empty or the path is wrong"; exit 1; }
          for model in Context ThreadSafeContext AsyncContext; do
            replayed=$(sed -n "s/^reactive-graph\[$model\]: \([0-9]\+\) fixtures.*/\1/p" /tmp/rg.log | tail -1)
            test -n "$replayed" || { echo "::error::reactive-graph corpus did not report a summary line for $model — the model never ran"; exit 1; }
            skipped=$(grep -c "^SKIP reactive-graph\[$model\] " /tmp/rg.log || true)
            test "$((replayed + skipped))" -eq "$expected" || { echo "::error::reactive-graph corpus accounted for $replayed replayed + $skipped declared-skipped = $((replayed + skipped)) of $expected fixtures against $model"; exit 1; }
          done

      - name: Test SeqCrdt conformance against canonical spec fixtures (#lzseqcrdt)
        run: |
          test -f ../lazily-spec/conformance/collections/seqcrdt_convergence.json || { echo "::error::seqcrdt_convergence.json missing — seqcrdt_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features distributed --test seqcrdt_conformance

      - name: Test register CRDT conformance against canonical spec fixtures
        run: |
          test -f ../lazily-spec/conformance/collections/registers_convergence.json || { echo "::error::registers_convergence.json missing — registers_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features distributed --test registers_conformance

      # The conformance runners `make check` names explicitly and CI did not run
      # at all (#lzguardsnotinci). Each one is the only executor of part of the
      # canonical corpus, so with these missing the fixture manifest can never be
      # complete and the coverage guard below could not have been switched on.
      #
      # The feature sets are not decoration. Several of these test binaries
      # compile to "running 0 tests" — exit 0, green tick, nothing asserted —
      # under any narrower feature set, which is the exact failure the guards
      # exist to reject.
      # Frame-codec round-trip obligation (#lzmsgpackparity). `ipc-msgpack` is
      # not optional: without it the msgpack fixture is never opened, and an
      # unopened canonical fixture is exactly what the conformance-coverage
      # guard fails on. msgpack is a protocol.md MUST — a feature flag is not a
      # carve-out.
      - name: Test frame-codec round-trip conformance against canonical spec fixtures
        run: |
          test -d ../lazily-spec/conformance/codec || { echo "::error::../lazily-spec/conformance/codec missing — codec_roundtrip_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features ipc,ipc-msgpack --test codec_roundtrip_conformance

      # NodeId exact-representation bound (#lzspecdecoderbound). protocol.md
      # § NodeId / PeerId stated the 2^53 bound as a PRODUCER obligation and left
      # the decoder half undefined; it now requires a decoder that cannot
      # represent a received identifier exactly to REJECT the frame rather than
      # round it. lazily-rs is u64-wide, so it must ACCEPT every scenario —
      # including u64::MAX — which makes it the reference reading of the fixture.
      # Both codecs, same reason as above.
      - name: Test NodeId exact-representation bound against canonical spec fixtures
        run: |
          test -f ../lazily-spec/conformance/codec/nodeid_exact_range.json || { echo "::error::../lazily-spec/conformance/codec/nodeid_exact_range.json missing — nodeid_exact_range_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features ipc,ipc-msgpack --test nodeid_exact_range_conformance

      # NodeKey null-leniency (#lzkeynullstrict). Omit-when-absent binds the
      # ENCODER; a decoder must read an omitted `key` and an explicit
      # `key: null` alike as absent, and must still emit the omitted form.
      - name: Test NodeKey null-leniency against canonical spec fixtures
        run: |
          test -f ../lazily-spec/conformance/codec/nodekey_null_leniency.json || { echo "::error::../lazily-spec/conformance/codec/nodekey_null_leniency.json missing — nodekey_null_leniency_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features ipc,ipc-msgpack --test nodekey_null_leniency_conformance

      # Blob-backend discriminator strictness (#lzblobbackendstrict). The
      # `backend` field's two forms get OPPOSITE answers: an OMITTED value MUST
      # decode as `shm` — that absence is the forward-compat channel, and the
      # only one — while a PRESENT value outside {shm, arrow, in_process} MUST be
      # rejected NAMING the token, never normalized, because normalizing routes a
      # foreign descriptor into the shm arena. The encoder half is checked too:
      # `backend` must be omitted for `shm` and emitted for `arrow`.
      - name: Test blob-backend discriminator strictness against canonical spec fixtures
        run: |
          test -f ../lazily-spec/conformance/codec/blob_backend_discriminator.json || { echo "::error::../lazily-spec/conformance/codec/blob_backend_discriminator.json missing — blob_backend_discriminator_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features ipc,ipc-msgpack --test blob_backend_discriminator_conformance

      - name: Test reliable-sync conformance against canonical spec fixtures
        run: |
          test -d ../lazily-spec/conformance/reliable-sync || { echo "::error::../lazily-spec/conformance/reliable-sync missing — reliable_sync_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features ipc,ipc-msgpack --test reliable_sync_conformance
          cargo +stable test --locked --features ipc,ipc-msgpack --lib reliable_sync::

      - name: Test generated Protobuf graph-boundary interop
        run: |
          test -f ../lazily-spec/conformance/protobuf/graph_boundary_traces.json || { echo "::error::canonical Protobuf graph-boundary traces missing"; exit 1; }
          cargo +stable test --locked --features protobuf --test protobuf_graph_boundary

      # TWO invocations: the fixture's four scenarios are not all expressible
      # against one backend — "stale handle cannot regress serialized cursor" is
      # a claim about two handles over ONE serialized store, which the by-value
      # in-memory adapter cannot hold. Without the second line that scenario is
      # never replayed while the fixture still counts as covered, which is
      # exactly the accounting gap the scenario ledger closes.
      - name: Test durable outbox store protocol against canonical spec fixtures
        run: |
          cargo +stable test --locked --features ipc --test durable_outbox
          cargo +stable test --locked --features durable-sqlite --test durable_outbox
          cargo +stable test --locked --features durable-sqlite --lib outbox::

      # All three map flavors. Under anything narrower than --all-features this
      # binary reports "running 0 tests" and exits 0.
      - name: Test keyed collections family conformance across all three flavors
        run: cargo +stable test --locked --all-features --test collections_family_conformance

      - name: Test queue family conformance across all three flavors
        run: cargo +stable test --locked --features "thread-safe async" --test queue_family_conformance

      - name: Test ingress family conformance across all three flavors
        run: |
          test -d ../lazily-spec/conformance/ingress || { echo "::error::../lazily-spec/conformance/ingress missing — ingress_family_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features "thread-safe async serde" --test ingress_family_conformance

      - name: Test egress family conformance across all three flavors
        run: |
          test -d ../lazily-spec/conformance/egress || { echo "::error::../lazily-spec/conformance/egress missing — egress_family_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features "thread-safe async" --test egress_family_conformance

      - name: Test reactive queue conformance against canonical spec fixtures
        run: cargo +stable test --locked --features serde --test queue_conformance

      # `crdt_tree_laws` is named here because no other target enables
      # `lossless-tree`: without this line the whole file compiles to nothing and
      # its replay of crdt-tree/algebra.json never happens.
      - name: Test lossless-tree CRDT conformance against canonical spec fixtures
        run: |
          test -d ../lazily-spec/conformance/lossless-tree || { echo "::error::../lazily-spec/conformance/lossless-tree missing — lossless_tree_conformance.rs cannot run"; exit 1; }
          cargo +stable test --locked --features "lossless-tree serde" --test lossless_tree_conformance --test lossless_tree_proptest --test lossless_tree_schema --test crdt_tree_laws

      - name: Test statechart conformance against canonical spec fixtures
        run: |
          cargo +stable test --locked --features statechart-json --test statechart_conformance
          cargo +stable test --locked --features statechart-json --lib statechart::

      - name: Test loom model
        run: cargo +stable test --locked --features loom --test thread_safe_loom

      # Rungs 1 and 4 of the conformance ladder (#lzguardsnotinci). Rungs 2 and 3
      # live inside the test binaries above and were already enforced here; these
      # two are a script step, so before this they ran only under `make check` and
      # CI enforced neither.
      #
      # The script itself SKIPs when the corpus is absent, so the corpus is
      # asserted here rather than trusted — a guard that exits 0 because its input
      # vanished is the vacuous green the whole ladder exists to reject. Same for
      # the evidence files: the script fails on an absent or empty manifest or
      # ledger, and the assertions below name which of the two is missing before
      # it has to.
      - name: Conformance coverage + scenario replay ledger (#lzguardsnotinci)
        run: |
          test -d ../lazily-spec/conformance || { echo "::error::../lazily-spec/conformance missing — check-conformance-coverage.sh would SKIP and exit 0"; exit 1; }
          test -s "$LAZILY_CONFORMANCE_MANIFEST" || { echo "::error::fixture manifest $LAZILY_CONFORMANCE_MANIFEST is absent or empty — the recorder never attached, so coverage cannot be computed"; exit 1; }
          test -s "$LAZILY_CONFORMANCE_SCENARIOS" || { echo "::error::scenario ledger $LAZILY_CONFORMANCE_SCENARIOS is absent or empty — the recorder never attached, so scenario coverage cannot be computed"; exit 1; }
          test -s "$LAZILY_CONFORMANCE_BLOCKS" || { echo "::error::assertion-block ledger $LAZILY_CONFORMANCE_BLOCKS is absent or empty — the recorder never attached, so the bind rung cannot be computed"; exit 1; }
          ./scripts/check-conformance-coverage.sh

      - name: Assertion observation ordering (#lzassertordering)
        run: python3 ../lazily-spec/scripts/check-assertion-ordering.py --binding rs --root .

      # The gate that keeps every step above honest. It compares `make check`'s
      # prerequisite closure against the run: bodies in this file and fails on
      # any target CI does not reach. Comments inside run: bodies are stripped
      # first — a naive grep for "make check" reported all nine bindings as
      # covered and every one of those hits was a comment.
      - name: CI-reachability guard
        run: |
          out=$(./scripts/check-ci-reach.sh 2>&1) || { echo "$out"; echo "::error::a make check gate is unreachable from CI"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "check-ci-reach: OK" || {
            echo "::error::the CI-reachability guard exited 0 without reaching its verdict"
            exit 1
          }

  # The budget gate (#vnmr). `make benchmark-check` has no skip: absent evidence
  # exits 2 and evidence measuring a different source tree exits 3. So CI has to
  # MEASURE before it can gate, and this job does exactly that.
  #
  # Its own job rather than a step in `test`, for two reasons. It compiles under
  # the bench profile, which shares nothing with `test`'s dev-profile artifacts,
  # so appending it to `test` would serialize a cold compile onto the critical
  # path; here it runs alongside and the added CI wall clock is only whatever it
  # exceeds the `test` job by. And a red budget then reads as a red budget
  # instead of hiding inside a job named "Rust".
  #
  # `benchmark-evidence` is Criterion's reduced-sample mode over the groups the
  # budgets and required-latency rows read. That is lower precision, not a stub —
  # the same benchmarks execute and the same instrumentation counters come out,
  # and those counters are what the budgets are expressed in. Each counter's
  # ceiling is derived from its own measured spread, and the scheduling-dominated
  # ones are recorded rather than enforced (#lzbenchbudgetheadroom), so this job
  # does not redden on runner scheduling.
  # Full-fidelity wall-clock numbers stay with the scheduled regressions workflow
  # and BENCHMARKS.md, where precision is the point.
  benchmark-budgets:
    name: Benchmark budget gate (#vnmr)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Measure (quick gating evidence)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: make benchmark-evidence

      - name: Enforce budgets
        env:
          RUSTUP_TOOLCHAIN: stable
        run: make benchmark-check

  signaling:
    name: Signaling Worker (#yxjw)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signaling
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `signaling/test/protocol.test.ts` imports the canonical signaling
      # fixtures as modules from `../../../lazily-spec/...`, i.e. a sibling of
      # the workspace — the same layout the Rust job clones. Without it `tsc
      # --noEmit` fails TS2307 on the fixture imports before a single test runs.
      - name: Fetch canonical lazily-spec conformance fixtures
        working-directory: .
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      - name: Guard the sibling fixtures the typecheck imports
        working-directory: .
        run: |
          test -d ../lazily-spec/conformance/signaling || { echo "::error::../lazily-spec/conformance/signaling missing — protocol.test.ts cannot typecheck"; exit 1; }

      - name: Install
        run: npm ci

      - name: Typecheck + test
        run: npm run check

  lean:
    name: Lean formal models (#lzleanmodel, #lzformal)
    runs-on: ubuntu-latest
    steps:
      # This checkout is what lets the job run the very make targets `make
      # check` runs, instead of an approximation of them. Both targets resolve
      # their Lean package as a SIBLING of this repo (LEAN_SPEC_DIR,
      # LEAN_FORMAL_DIR), so the three checkouts below sit side by side exactly
      # as they do on a developer machine.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: lazily-rs

      - name: Checkout canonical lazily-spec
        uses: actions/checkout@v4
        with:
          repository: lazily-hub/lazily-spec
          path: lazily-spec

      - name: Build lazily-spec Lean formal model (#lzleanmodel)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lazily-spec/formal/lean
          auto-config: false
          build: true
          test: false
          lint: false

      - name: Checkout canonical lazily-formal
        uses: actions/checkout@v4
        with:
          repository: lazily-hub/lazily-formal
          path: lazily-formal

      - name: Build lazily-formal Lean model (#lzformal)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lazily-formal
          auto-config: false
          build: true
          test: false
          lint: false

      # The two steps above build the models through the Lean action, which the
      # CI-reachability guard cannot see: it reads run: bodies, and a `uses:`
      # step has none. These two run the make targets themselves, which is what
      # makes the guard's claim true rather than approximately true — and they
      # additionally exercise the sibling-directory contract the targets carry,
      # which the action steps do not. lean-action puts elan on PATH for later
      # steps, and lake over an already-built package is a no-op.
      - name: Build the lazily-spec Lean model through make
        working-directory: lazily-rs
        run: make test-lean-formal

      - name: Build the lazily-formal Lean model through make
        working-directory: lazily-rs
        run: make test-lazily-formal
